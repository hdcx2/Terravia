name: Deploy static site to GitHub Pages

# Publishes the Terravia static website (HTML/CSS/JS/images). The chatbot API
# (api.py) is NOT deployed here: GitHub Pages serves static files only. Run the
# API separately and point config.js at it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve the repo root (index.html, styles.css, script.js, config.js,
          # images/, and the other HTML pages live here).
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
